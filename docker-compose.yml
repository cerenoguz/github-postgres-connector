# A local PostgreSQL for trying the connector. Not for production use.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: connector
      POSTGRES_PASSWORD: connector
      POSTGRES_DB: connector
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connector -d connector"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
