name: ci

on:
  push:
  pull_request:

# The workflow only reads the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      # The runner has Docker, so the PostgreSQL integration tests run too.
      - name: Test
        run: go test -race -count=1 ./...
